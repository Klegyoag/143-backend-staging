services:
  - type: web
    name: 143-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh -lc 'php artisan serve --host=0.0.0.0 --port=${PORT:-10000}'
    healthCheckPath: /up
    preDeployCommand: php artisan migrate --force
    initialDeployHook: php artisan db:seed --force
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://143-api.onrender.com
      - key: APP_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: 143-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: 143-cache
          property: connectionString
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: SESSION_DRIVER
        value: redis
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: REVERB_APP_ID
        value: "143"
      - key: REVERB_APP_KEY
        sync: false
      - key: REVERB_APP_SECRET
        sync: false
      - key: REVERB_HOST
        value: 143-reverb.onrender.com
      - key: REVERB_PORT
        value: "443"
      - key: REVERB_SCHEME
        value: https
      - key: UPLOAD_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-5.4
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_PLUS_MONTHLY_PLAN_ID
        sync: false
      - key: PAYPAL_PLUS_YEARLY_PLAN_ID
        sync: false
      - key: PAYPAL_TOGETHER_MONTHLY_PLAN_ID
        sync: false
      - key: PAYPAL_TOGETHER_YEARLY_PLAN_ID
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        value: https://143-api.onrender.com/api/v1/integrations/spotify/callback
      - key: MAPS_API_KEY
        sync: false
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false

  - type: worker
    name: 143-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: php artisan queue:work --sleep=1 --tries=3 --timeout=120 --max-time=3600
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: 143-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: 143-cache
          property: connectionString
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false

  - type: web
    name: 143-reverb
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh -lc 'php artisan reverb:start --host=0.0.0.0 --port=${PORT:-10000}'
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: 143-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: 143-cache
          property: connectionString
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: REVERB_APP_ID
        value: "143"
      - key: REVERB_APP_KEY
        sync: false
      - key: REVERB_APP_SECRET
        sync: false

  - type: cron
    name: 143-scheduler
    runtime: docker
    plan: starter
    region: singapore
    schedule: "* * * * *"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: php artisan schedule:run
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: 143-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: 143-cache
          property: connectionString

  - type: keyvalue
    name: 143-cache
    plan: starter
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru


databases:
  - name: 143-postgres
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "18"
    databaseName: app143
    user: app143
    ipAllowList: []
