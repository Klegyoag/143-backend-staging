services:
  app:
    build: .
    env_file: .env
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  queue:
    build: .
    env_file: .env
    command: php artisan queue:work --tries=3 --timeout=120
    depends_on: [postgres, redis, minio-init]

  scheduler:
    build: .
    env_file: .env
    command: php artisan schedule:work
    depends_on: [postgres, redis]

  reverb:
    build: .
    env_file: .env
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports: ["8080:8080"]
    depends_on: [postgres, redis]

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: app143
      POSTGRES_USER: app143
      POSTGRES_PASSWORD: app143
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]

  redis:
    image: redis:8-alpine
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio12345; do sleep 2; done;
      mc mb --ignore-existing local/143-private;
      mc anonymous set none local/143-private;
      exit 0;"

volumes:
  pgdata: {}
  miniodata: {}
